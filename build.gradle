plugins {
    id 'jacoco'
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    implementation xplibs.api.web
    include xplibs.auth
    include xplibs.common
    include xplibs.context
    include xplibs.portal
    include xplibs.cluster
    include xplibs.event
    include xplibs.grid

    include libs.lib.httpclient
    include libs.java.jwt
    include libs.jwks.rsa
    include libs.jackson.databind

    testImplementation "com.enonic.xp:testing:${xplibs.versions.xp.get()}"
    testImplementation( platform( libs.junit.bom ) )
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.graalvm.polyglot:js:25.0.3'
}

repositories {
    mavenCentral()
    xp.enonicRepo('dev')
}

test {
    useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'xp.script-engine', 'GraalJS'
    shouldRunAfter test
}
check.dependsOn testGraalJs

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

check.dependsOn jacocoTestReport
